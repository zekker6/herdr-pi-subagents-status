version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
  install:
    desc: Install development dependencies
    cmds:
      - bun install --frozen-lockfile
  lint:
    desc: Type-check the extension
    cmds:
      - bun run lint
  test:
    desc: Run regression and isolated installation tests
    cmds:
      - bun run test
  check:
    desc: Run all checks
    cmds:
      - task: lint
      - task: test
